<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraFit & Adventure | Train Hard. Explore Further.</title>
    <meta name="description" content="Discover extreme workouts and wilderness outdoor adventures in one unified fitness platform." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
      (function () {
        var hash = window.location.hash || '';
        if (hash.indexOf('access_token=') !== -1 || hash.indexOf('id_token=') !== -1 || hash.indexOf('error=') !== -1) {
          try {
            localStorage.setItem(
              'smartfit_google_oauth_hash',
              JSON.stringify({ hash: hash, ts: Date.now() })
            );
          } catch (e) {}
          if (window.opener && window.opener !== window) {
            try {
              window.opener.postMessage(
                { type: 'SMARTFIT_GOOGLE_AUTH', hash: hash },
                '*'
              );
              window.close();
            } catch (e) {}
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
